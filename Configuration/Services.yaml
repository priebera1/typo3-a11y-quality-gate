services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Priebera\A11yQualityGate\:
    resource: '../Classes/*'

  Priebera\A11yQualityGate\Scan\ScanOrchestrator:
    public: true

  Priebera\A11yQualityGate\Service\SiteResolutionService:
    public: true

  Priebera\A11yQualityGate\Hook\PublishHook:
    public: true

  Priebera\A11yQualityGate\Rule\RuleRegistry:
    arguments:
      $rules: !tagged_iterator a11y_quality_gate.rule

  Priebera\A11yQualityGate\Rule\Rte\ImgAltMissingRule:
    tags:
      - name: a11y_quality_gate.rule

  Priebera\A11yQualityGate\Rule\Rte\ImgAltIsFilenameRule:
    tags:
      - name: a11y_quality_gate.rule

  Priebera\A11yQualityGate\Rule\Rte\ImgAltTooLongRule:
    arguments:
      $defaultMaxLength: 120
    tags:
      - name: a11y_quality_gate.rule

  Priebera\A11yQualityGate\Rule\Rte\ImgAltRedundantPhraseRule:
    tags:
      - name: a11y_quality_gate.rule

  Priebera\A11yQualityGate\Rule\Rte\EmptyHeadingRule:
    tags:
      - name: a11y_quality_gate.rule

  Priebera\A11yQualityGate\Rule\Rte\EmptyLinkRule:
    tags:
      - name: a11y_quality_gate.rule

  Priebera\A11yQualityGate\Rule\Rte\LinkTextDuplicateDifferentTargetsRule:
    tags:
      - name: a11y_quality_gate.rule

  Priebera\A11yQualityGate\Rule\Rte\NonDescriptiveLinkRule:
    tags:
      - name: a11y_quality_gate.rule

  Priebera\A11yQualityGate\Rule\Rte\ButtonLabelMissingRule:
    tags:
      - name: a11y_quality_gate.rule

  Priebera\A11yQualityGate\Rule\Rte\TableMissingHeaderRule:
    tags:
      - name: a11y_quality_gate.rule

  Priebera\A11yQualityGate\Rule\Rte\TableThMissingScopeRule:
    tags:
      - name: a11y_quality_gate.rule

  Priebera\A11yQualityGate\Rule\Rte\TableMissingCaptionRule:
    tags:
      - name: a11y_quality_gate.rule

  Priebera\A11yQualityGate\Rule\Rte\DuplicateIdRule:
    tags:
      - name: a11y_quality_gate.rule

  Priebera\A11yQualityGate\Rule\Rte\SvgMissingTitleRule:
    tags:
      - name: a11y_quality_gate.rule

  Priebera\A11yQualityGate\Rule\Rte\IframeMissingTitleRule:
    tags:
      - name: a11y_quality_gate.rule

  Priebera\A11yQualityGate\Rule\Rte\ImageInLinkMissingAltRule:
    tags:
      - name: a11y_quality_gate.rule

  Priebera\A11yQualityGate\Rule\Rte\MarqueeOrBlinkRule:
    tags:
      - name: a11y_quality_gate.rule

  Priebera\A11yQualityGate\Rule\Structured\FileReferenceAltRule:
    tags:
      - name: a11y_quality_gate.rule

  Priebera\A11yQualityGate\Rule\Structured\FileReferenceAltQualityRule:
    arguments:
      $defaultMaxLength: 120
    tags:
      - name: a11y_quality_gate.rule

  Priebera\A11yQualityGate\Rule\Structured\HeaderCtypeEmptyRule:
    tags:
      - name: a11y_quality_gate.rule

  Priebera\A11yQualityGate\Rule\Structured\HeaderLinkNoTextRule:
    tags:
      - name: a11y_quality_gate.rule

  Priebera\A11yQualityGate\Rule\Structured\HeaderLevelIsH1Rule:
    tags:
      - name: a11y_quality_gate.rule

  Priebera\A11yQualityGate\Rule\Structured\UploadsFileMissingDescriptionRule:
    tags:
      - name: a11y_quality_gate.rule

  Priebera\A11yQualityGate\Rule\Structured\MediaNoTranscriptHintRule:
    tags:
      - name: a11y_quality_gate.rule

  Priebera\A11yQualityGate\Rule\Structured\TableMissingCaptionRule:
    tags:
      - name: a11y_quality_gate.rule

  Priebera\A11yQualityGate\Rule\Structured\FormPlaceholderAsLabelRule:
    tags:
      - name: a11y_quality_gate.rule

  Priebera\A11yQualityGate\Rule\Structured\FormFieldLabelMissingRule:
    tags:
      - name: a11y_quality_gate.rule

  Priebera\A11yQualityGate\Rule\Structured\FormAutocompleteMissingRule:
    arguments:
      $personalFieldPatterns:
        - '/name/i'
        - '/email/i'
        - '/phone/i'
        - '/tel/i'
        - '/address/i'
        - '/zip/i'
        - '/postal/i'
        - '/country/i'
        - '/birth/i'
        - '/city/i'
    tags:
      - name: a11y_quality_gate.rule

  Priebera\A11yQualityGate\Rule\Rte\HeadingHierarchyRule:
    tags:
      - name: a11y_quality_gate.rule

  Priebera\A11yQualityGate\Rule\Rte\LinkTextIsUrlOrFilenameRule:
    arguments:
      $documentExtensions:
        - 'pdf'
        - 'docx'
        - 'doc'
        - 'xlsx'
        - 'xls'
        - 'pptx'
        - 'ppt'
        - 'csv'
        - 'zip'
        - 'txt'
    tags:
      - name: a11y_quality_gate.rule

  Priebera\A11yQualityGate\Rule\Rte\LinkToDocumentRule:
    arguments:
      $documentExtensions:
        - 'pdf'
        - 'doc'
        - 'docx'
        - 'xls'
        - 'xlsx'
        - 'ppt'
        - 'pptx'
        - 'odt'
        - 'ods'
        - 'odp'
        - 'rtf'
        - 'csv'
    tags:
      - name: a11y_quality_gate.rule

  Priebera\A11yQualityGate\Rule\Rte\LinkToDocumentMissingNoticeRule:
    tags:
      - name: a11y_quality_gate.rule

  Priebera\A11yQualityGate\Rule\Rte\LinkNewWindowNoWarningRule:
    tags:
      - name: a11y_quality_gate.rule

  Priebera\A11yQualityGate\Backend\ToolbarItems\A11yScanToolbarItem:
    tags:
      - name: backend.toolbar.item
        identifier: a11yScanToolbarItem

  Priebera\A11yQualityGate\EventListener\RteConfigurationListener:
    tags:
      - name: event.listener
        identifier: 'a11y-quality-gate/rte-configuration-listener'
        event: TYPO3\CMS\RteCKEditor\Form\Element\Event\BeforePrepareConfigurationForEditorEvent

  Priebera\A11yQualityGate\EventListener\ModifyPageLayoutContentListener:
    tags:
      - name: event.listener
        identifier: 'a11y-quality-gate/modify-page-layout-content-listener'
        event: TYPO3\CMS\Backend\Controller\Event\ModifyPageLayoutContentEvent

  Priebera\A11yQualityGate\Command\ScanCommand:
    tags:
      - name: console.command
        command: 'a11y:scan'
        description: 'Scan TYPO3 content for accessibility issues.'
        schedulable: false

  Priebera\A11yQualityGate\Rendered\RenderedHtmlRuleRegistry:
    arguments:
      $rules: !tagged_iterator a11y_quality_gate.rendered_rule

  Priebera\A11yQualityGate\Rendered\Rule\ImgMissingAltRule:
    tags:
      - name: a11y_quality_gate.rendered_rule

  Priebera\A11yQualityGate\Rendered\Rule\EmptyLinkRule:
    tags:
      - name: a11y_quality_gate.rendered_rule

  Priebera\A11yQualityGate\Rendered\Rule\EmptyButtonRule:
    tags:
      - name: a11y_quality_gate.rendered_rule

  Priebera\A11yQualityGate\Rendered\Rule\IframeMissingTitleRule:
    tags:
      - name: a11y_quality_gate.rendered_rule

  Priebera\A11yQualityGate\Rendered\Rule\FormControlMissingLabelRule:
    tags:
      - name: a11y_quality_gate.rendered_rule

  Priebera\A11yQualityGate\Rendered\Rule\EmptyHeadingRule:
    tags:
      - name: a11y_quality_gate.rendered_rule

  Priebera\A11yQualityGate\Rendered\Rule\DuplicateIdRule:
    tags:
      - name: a11y_quality_gate.rendered_rule

  Priebera\A11yQualityGate\Rendered\Rule\TableMissingHeaderRule:
    tags:
      - name: a11y_quality_gate.rendered_rule

  Priebera\A11yQualityGate\Rendered\Rule\TableEmptyHeaderRule:
    tags:
      - name: a11y_quality_gate.rendered_rule

  Priebera\A11yQualityGate\Rendered\Rule\SvgMissingAccessibleNameRule:
    tags:
      - name: a11y_quality_gate.rendered_rule

  Priebera\A11yQualityGate\Rendered\Rule\HtmlLangMissingRule:
    tags:
      - name: a11y_quality_gate.rendered_rule

  Priebera\A11yQualityGate\Rendered\Rule\PageTitleMissingRule:
    tags:
      - name: a11y_quality_gate.rendered_rule

  Priebera\A11yQualityGate\Rendered\Rule\MainLandmarkMissingRule:
    tags:
      - name: a11y_quality_gate.rendered_rule
