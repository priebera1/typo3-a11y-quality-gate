services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  _instanceof:
    Priebera\A11yQualityGate\Rule\RuleInterface:
      tags:
        - name: a11y_quality_gate.rule

    Priebera\A11yQualityGate\Rendered\RenderedHtmlRuleInterface:
      tags:
        - name: a11y_quality_gate.rendered_rule

    Priebera\A11yQualityGate\Ai\Contract\AiProviderInterface:
      tags:
        - name: a11y_quality_gate.ai_provider

    Priebera\A11yQualityGate\Ai\Contract\AiModelDiscoveryProviderInterface:
      tags:
        - name: a11y_quality_gate.ai_model_discovery_provider

  Priebera\A11yQualityGate\:
    resource: '../Classes/*'

  Priebera\A11yQualityGate\Scan\ScanOrchestrator:
    public: true

  Priebera\A11yQualityGate\Service\SiteResolutionService:
    public: true

  Priebera\A11yQualityGate\Hook\PublishHook:
    public: true

  Priebera\A11yQualityGate\Hook\FileReferenceDecorativeHook:
    public: true
    autowire: true

  Priebera\A11yQualityGate\Rule\RuleRegistry:
    arguments:
      $rules: !tagged_iterator a11y_quality_gate.rule

  Priebera\A11yQualityGate\Rendered\RenderedHtmlRuleRegistry:
    arguments:
      $rules: !tagged_iterator a11y_quality_gate.rendered_rule

  Priebera\A11yQualityGate\Rule\Rte\ImgAltTooLongRule:
    arguments:
      $defaultMaxLength: 120

  Priebera\A11yQualityGate\Rule\Structured\FileReferenceAltQualityRule:
    arguments:
      $defaultMaxLength: 120

  Priebera\A11yQualityGate\Rule\Structured\FormAutocompleteMissingRule:
    arguments:
      $personalFieldPatterns:
        - '/name/i'
        - '/email/i'
        - '/phone/i'
        - '/tel/i'
        - '/address/i'
        - '/zip/i'
        - '/postal/i'
        - '/country/i'
        - '/birth/i'
        - '/city/i'

  Priebera\A11yQualityGate\Rule\Rte\LinkTextIsUrlOrFilenameRule:
    arguments:
      $documentExtensions:
        - 'pdf'
        - 'docx'
        - 'doc'
        - 'xlsx'
        - 'xls'
        - 'pptx'
        - 'ppt'
        - 'csv'
        - 'zip'
        - 'txt'

  Priebera\A11yQualityGate\Rule\Rte\LinkToDocumentRule:
    arguments:
      $documentExtensions:
        - 'pdf'
        - 'doc'
        - 'docx'
        - 'xls'
        - 'xlsx'
        - 'ppt'
        - 'pptx'
        - 'odt'
        - 'ods'
        - 'odp'
        - 'rtf'
        - 'csv'

  Priebera\A11yQualityGate\Backend\ToolbarItems\A11yScanToolbarItem:
    tags:
      - name: backend.toolbar.item
        identifier: a11yScanToolbarItem

  Priebera\A11yQualityGate\EventListener\RteConfigurationListener:
    tags:
      - name: event.listener
        identifier: 'a11y-quality-gate/rte-configuration-listener'
        event: TYPO3\CMS\RteCKEditor\Form\Element\Event\BeforePrepareConfigurationForEditorEvent

  Priebera\A11yQualityGate\EventListener\ModifyPageLayoutContentListener:
    tags:
      - name: event.listener
        identifier: 'a11y-quality-gate/modify-page-layout-content-listener'
        event: TYPO3\CMS\Backend\Controller\Event\ModifyPageLayoutContentEvent

  Priebera\A11yQualityGate\Command\ScanCommand:
    tags:
      - name: console.command
        command: 'a11y:scan'
        description: 'Scan TYPO3 content for accessibility issues.'
        schedulable: false

  Priebera\A11yQualityGate\Ai\Service\AiAltSuggestionService:
    arguments:
      $providers: !tagged_iterator a11y_quality_gate.ai_provider

  Priebera\A11yQualityGate\Ai\Service\AiModelDiscoveryService:
    arguments:
      $providers: !tagged_iterator a11y_quality_gate.ai_model_discovery_provider

  Priebera\A11yQualityGate\Controller\AiSettingsAjaxController:
    arguments:
      $providers: !tagged_iterator a11y_quality_gate.ai_provider

  Priebera\A11yQualityGate\Controller\ImageRemediationAjaxController:
    arguments:
      $service: '@Priebera\A11yQualityGate\Remediation\ImageRemediationService'
      $permissionService: '@Priebera\A11yQualityGate\Remediation\ImageRemediationPermissionService'

  Priebera\A11yQualityGate\Remediation\ImageRemediationServiceInterface:
    alias: Priebera\A11yQualityGate\Remediation\ImageRemediationService

  Priebera\A11yQualityGate\Ai\Contract\AiAltSuggestionServiceInterface:
    alias: Priebera\A11yQualityGate\Ai\Service\AiAltSuggestionService

  Priebera\A11yQualityGate\Domain\Repository\Contract\AiConfigurationRepositoryInterface:
    alias: Priebera\A11yQualityGate\Domain\Repository\AiConfigurationRepository
  Priebera\A11yQualityGate\Domain\Repository\Contract\AiRateLimitRepositoryInterface:
    alias: Priebera\A11yQualityGate\Domain\Repository\AiRateLimitRepository
  Priebera\A11yQualityGate\Domain\Repository\Contract\FileReferenceRepositoryInterface:
    alias: Priebera\A11yQualityGate\Domain\Repository\FileReferenceRepository
  Priebera\A11yQualityGate\Domain\Repository\Contract\IssueRemediationRepositoryInterface:
    alias: Priebera\A11yQualityGate\Domain\Repository\IssueRepository
  Priebera\A11yQualityGate\Contract\AccessControlServiceInterface:
    alias: Priebera\A11yQualityGate\Service\AccessControlService
  Priebera\A11yQualityGate\Contract\BackendContextServiceInterface:
    alias: Priebera\A11yQualityGate\Service\BackendContextService
  Priebera\A11yQualityGate\Contract\SiteResolutionServiceInterface:
    alias: Priebera\A11yQualityGate\Service\SiteResolutionService
  Priebera\A11yQualityGate\Contract\SecretEncryptionServiceInterface:
    alias: Priebera\A11yQualityGate\Service\SecretEncryptionService
  Priebera\A11yQualityGate\Contract\BackendUserServiceInterface:
    alias: Priebera\A11yQualityGate\Service\BackendUserService
  Priebera\A11yQualityGate\Contract\BackendRecordAccessServiceInterface:
    alias: Priebera\A11yQualityGate\Service\BackendRecordAccessService
  Priebera\A11yQualityGate\Remediation\Contract\FileReferenceSchemaServiceInterface:
    alias: Priebera\A11yQualityGate\Remediation\FileReferenceSchemaService
  Priebera\A11yQualityGate\Remediation\Contract\ImageFindingVersionTokenServiceInterface:
    alias: Priebera\A11yQualityGate\Remediation\ImageFindingVersionTokenService
  Priebera\A11yQualityGate\Remediation\Contract\ImageRemediationPermissionServiceInterface:
    alias: Priebera\A11yQualityGate\Remediation\ImageRemediationPermissionService
  Priebera\A11yQualityGate\Remediation\Contract\ImageRemediationTransactionManagerInterface:
    alias: Priebera\A11yQualityGate\Remediation\ImageRemediationTransactionManager
  Priebera\A11yQualityGate\Ai\Contract\AiConfigurationManagerInterface:
    alias: Priebera\A11yQualityGate\Ai\Service\AiConfigurationManager
  Priebera\A11yQualityGate\Ai\Contract\AiConfigurationResolverInterface:
    alias: Priebera\A11yQualityGate\Ai\Service\AiConfigurationResolver
  Priebera\A11yQualityGate\Ai\Contract\AiModelDiscoveryServiceInterface:
    alias: Priebera\A11yQualityGate\Ai\Service\AiModelDiscoveryService
  Priebera\A11yQualityGate\Ai\Contract\AiFeatureAccessServiceInterface:
    alias: Priebera\A11yQualityGate\Ai\Service\AiFeatureAccessService
  Priebera\A11yQualityGate\Ai\Contract\AiProcessedImageMaterializerInterface:
    alias: Priebera\A11yQualityGate\Ai\Service\CoreAiProcessedImageMaterializer
  Priebera\A11yQualityGate\Remediation\Contract\ImageFindingContextResolverInterface:
    alias: Priebera\A11yQualityGate\Remediation\ImageFindingContextResolver
  Priebera\A11yQualityGate\Remediation\Contract\ImageReferenceWriterInterface:
    alias: Priebera\A11yQualityGate\Remediation\DataHandlerImageReferenceWriter
