services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  _instanceof:
    Priebera\A11yQualityGate\Rule\RuleInterface:
      tags:
        - name: a11y_quality_gate.rule

    Priebera\A11yQualityGate\Rendered\RenderedHtmlRuleInterface:
      tags:
        - name: a11y_quality_gate.rendered_rule

    Priebera\A11yQualityGate\Ai\Contract\AiProviderInterface:
      tags:
        - name: a11y_quality_gate.ai_provider

    Priebera\A11yQualityGate\Ai\Contract\AiModelDiscoveryProviderInterface:
      tags:
        - name: a11y_quality_gate.ai_model_discovery_provider

    Priebera\A11yQualityGate\Ai\Task\AiStructuredTaskExecutorInterface:
      tags:
        - name: a11y_quality_gate.ai_task_executor

  Priebera\A11yQualityGate\:
    resource: '../Classes/*'

  Priebera\A11yQualityGate\Scan\ScanOrchestrator:
    public: true

  Priebera\A11yQualityGate\Service\SiteResolutionService:
    public: true

  # The Scheduler content scan task (A11yScanTask) takes the scan lock from the container (D-02).
  Priebera\A11yQualityGate\Service\ScanStatusService:
    public: true

  # My issues: verdicts depend on the acting and the assigned user and on group rights that may change mid-request.
  Priebera\A11yQualityGate\Assignment\AssignmentService:
    public: true
    shared: false

  Priebera\A11yQualityGate\Pro\Service\RemoteScanTreeCoverageService:
    public: true

  Priebera\A11yQualityGate\Assignment\AssigneeEligibility:
    shared: false

  Priebera\A11yQualityGate\Hook\PublishHook:
    public: true

  Priebera\A11yQualityGate\Hook\WorkspacePublishGateHook:
    public: true

  Priebera\A11yQualityGate\Workspace\PublishPreviewContext:
    shared: true

  Priebera\A11yQualityGate\QualityGate\Contract\GateLicenceInterface:
    alias: Priebera\A11yQualityGate\QualityGate\GateLicence

  Priebera\A11yQualityGate\EventListener\WorkspacePublishGateHookOrder:
    tags:
      - name: event.listener
        identifier: 'a11y-quality-gate/workspace-publish-gate-hook-order'
        event: TYPO3\CMS\Core\Core\Event\BootCompletedEvent

  Priebera\A11yQualityGate\Hook\FileReferenceDecorativeHook:
    public: true
    autowire: true

  Priebera\A11yQualityGate\Rule\RuleRegistry:
    arguments:
      $rules: !tagged_iterator a11y_quality_gate.rule

  Priebera\A11yQualityGate\Rendered\RenderedHtmlRuleRegistry:
    arguments:
      $rules: !tagged_iterator a11y_quality_gate.rendered_rule

  Priebera\A11yQualityGate\Rule\Rte\ImgAltTooLongRule:
    arguments:
      $defaultMaxLength: 120

  Priebera\A11yQualityGate\Rule\Structured\FileReferenceAltQualityRule:
    arguments:
      $defaultMaxLength: 120

  Priebera\A11yQualityGate\Rule\Structured\FormAutocompleteMissingRule:
    arguments:
      $personalFieldPatterns:
        - '/name/i'
        - '/email/i'
        - '/phone/i'
        - '/tel/i'
        - '/address/i'
        - '/zip/i'
        - '/postal/i'
        - '/country/i'
        - '/birth/i'
        - '/city/i'

  Priebera\A11yQualityGate\Rule\Rte\LinkTextIsUrlOrFilenameRule:
    arguments:
      $documentExtensions:
        - 'pdf'
        - 'docx'
        - 'doc'
        - 'xlsx'
        - 'xls'
        - 'pptx'
        - 'ppt'
        - 'csv'
        - 'zip'
        - 'txt'

  Priebera\A11yQualityGate\Rule\Rte\LinkToDocumentRule:
    arguments:
      $documentExtensions:
        - 'pdf'
        - 'doc'
        - 'docx'
        - 'xls'
        - 'xlsx'
        - 'ppt'
        - 'pptx'
        - 'odt'
        - 'ods'
        - 'odp'
        - 'rtf'
        - 'csv'

  # The toolbar's "Open MCP" link follows the gates of the "My connected agents" screen (see ConnectedAgentsLinkResolver).
  Priebera\A11yQualityGate\Backend\ToolbarItems\ConnectedAgents\ConnectedAgentsAvailabilityInterface:
    alias: Priebera\A11yQualityGate\Backend\ToolbarItems\ConnectedAgents\McpConnectedAgentsAvailability

  Priebera\A11yQualityGate\Backend\ToolbarItems\A11yScanToolbarItem:
    tags:
      - name: backend.toolbar.item
        identifier: a11yScanToolbarItem

  Priebera\A11yQualityGate\EventListener\RteConfigurationListener:
    tags:
      - name: event.listener
        identifier: 'a11y-quality-gate/rte-configuration-listener'
        event: TYPO3\CMS\RteCKEditor\Form\Element\Event\BeforePrepareConfigurationForEditorEvent

  Priebera\A11yQualityGate\EventListener\ModifyPageLayoutContentListener:
    tags:
      - name: event.listener
        identifier: 'a11y-quality-gate/modify-page-layout-content-listener'
        event: TYPO3\CMS\Backend\Controller\Event\ModifyPageLayoutContentEvent

  Priebera\A11yQualityGate\EventListener\FreeTermsCacheFlushListener:
    tags:
      - name: event.listener
        identifier: 'a11y-quality-gate/free-terms-cache-flush-listener'
        event: TYPO3\CMS\Core\Cache\Event\CacheFlushEvent

  # Console commands are registered here only, never also with #[AsCommand]: TYPO3 13 and 14 autoconfigure
  # that attribute into a second console.command tag, and the second tag of a command registers it as an
  # alias of itself, which hides it from `typo3 list` and from the TYPO3 14 Scheduler task types
  # (Tests/Unit/Command/ConsoleCommandRegistrationTest.php).
  Priebera\A11yQualityGate\Command\ScanCommand:
    tags:
      - name: console.command
        command: 'a11y:scan'
        description: 'Scan TYPO3 content for accessibility issues.'
        # Offered by "Execute console commands" on TYPO3 13 since 1.0.0; kept so existing tasks keep working.
        schedulable: true

  Priebera\A11yQualityGate\Command\MonitorCommand:
    tags:
      - name: console.command
        command: 'a11y:monitor'
        description: 'Scan a site with the AQG frontend scanner and notify on accessibility regressions (PRO/Agency).'
        # Scheduled with the "Accessibility monitoring" task (site and language selectors), not as a raw command.
        schedulable: false

  Priebera\A11yQualityGate\Command\InstallationIdentityCommand:
    tags:
      - name: console.command
        command: 'a11y:installation:identity'
        description: 'Show the AQG identity of this TYPO3 installation, or give a database copy that is a separate installation a new one.'
        # A one-off operator decision with licensing consequences (a new Agency project): never a Scheduler task.
        schedulable: false

  Priebera\A11yQualityGate\Command\HistoryPruneCommand:
    tags:
      - name: console.command
        command: 'a11y:history:prune'
        description: 'Delete stored frontend scans older than the period set in Settings › Scan history (dry run unless --apply).'
        # Deletes stored history: run deliberately by an operator (dry run by default), never as a recurring Scheduler task,
        # so a shortened period cannot delete scans nobody reviewed.
        schedulable: false

  Priebera\A11yQualityGate\Command\RemoteDuplicateRepairCommand:
    tags:
      - name: console.command
        command: 'a11y:remote:repair-duplicates'
        description: 'Remove pages and findings that a frontend scan stored twice (dry run unless --apply --backup=<file>; --restore rolls back).'
        # Changes stored history: run deliberately by an operator after reviewing the dry run, never as a Scheduler task.
        schedulable: false

  Priebera\A11yQualityGate\Command\McpAuditPruneCommand:
    tags:
      - name: console.command
        command: 'a11y:mcp:audit-prune'
        description: 'Agent access (MCP): delete audit entries older than the configured retention (mcpAuditRetentionDays); deletes nothing without one.'
        # The connector prunes at every start (the supervisor restarts it hourly via --max-runtime); this command is for
        # operators and system cron when no connector runs. Not a Scheduler task type (keeps the AQG task list).
        schedulable: false

  Priebera\A11yQualityGate\Command\McpResetLocalCommand:
    tags:
      - name: console.command
        command: 'a11y:mcp:reset-local'
        description: 'Agent access (MCP): forget this installation''s Gateway connection locally, without contacting the Gateway (for a copy of an installation).'
        # Changes only this database: a copy holds the original's credential, so it must never disconnect at the Gateway.
        schedulable: false

  Priebera\A11yQualityGate\Command\McpConnectorCommand:
    tags:
      - name: console.command
        command: 'a11y:mcp:connector'
        description: 'Agent access (MCP): outbound connector to the AQG MCP Gateway. Run as a supervised service, not as a Scheduler task.'
        # A long-running worker (systemd, Supervisor, container); the Scheduler cannot keep it running.
        schedulable: false

  Priebera\A11yQualityGate\Command\McpConnectorWorkerCommand:
    tags:
      - name: console.command
        command: 'a11y:mcp:connector:worker'
        description: 'Agent access (MCP): a worker process of a11y:mcp:connector (started by it; not run by hand).'
        # Started and fed by the connector through stdin (Fable F-02); listing it would only invite running it by hand.
        hidden: true
        schedulable: false

  Priebera\A11yQualityGate\Service\RemoteMonitoringService:
    public: true

  Priebera\A11yQualityGate\Monitoring\MonitoringTargetResolver:
    public: true

  Priebera\A11yQualityGate\Monitoring\MonitoringTaskValidator:
    public: true

  Priebera\A11yQualityGate\Scheduler\MonitoringTaskAdditionalFieldProvider:
    public: true

  Priebera\A11yQualityGate\Scheduler\MonitoringTaskTcaItems:
    public: true

  Priebera\A11yQualityGate\Hook\MonitoringTaskLanguageHook:
    public: true

  Priebera\A11yQualityGate\Ai\Service\AiAltSuggestionService:
    arguments:
      $providers: !tagged_iterator a11y_quality_gate.ai_provider

  Priebera\A11yQualityGate\Ai\Service\AiModelDiscoveryService:
    arguments:
      $providers: !tagged_iterator a11y_quality_gate.ai_model_discovery_provider

  Priebera\A11yQualityGate\Ai\Service\AiLinkTextSuggestionService:
    arguments:
      $providers: !tagged_iterator a11y_quality_gate.ai_provider

  Priebera\A11yQualityGate\Ai\Service\AiIframeTitleSuggestionService:
    arguments:
      $providers: !tagged_iterator a11y_quality_gate.ai_provider

  # Read by the plain HTML FormEngine wizard (created by FormEngine, not by DI).
