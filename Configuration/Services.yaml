    public: true
  Priebera\A11yQualityGate\Ai\Media\FileMetadataRecordResolver:
    public: true
  Priebera\A11yQualityGate\Ai\Media\MediaAiSiteResolver:
    public: true

  Priebera\A11yQualityGate\EventListener\FilelistMediaAiListener:
