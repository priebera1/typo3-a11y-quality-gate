      - name: event.listener
        identifier: 'a11y-quality-gate/filelist-media-ai-actions'
        method: 'addFileAction'
        event: TYPO3\CMS\Filelist\Event\ProcessFileListActionsEvent
      - name: event.listener
        identifier: 'a11y-quality-gate/filelist-media-ai-assets'
        method: 'loadInFilelist'
        event: TYPO3\CMS\Backend\Template\Components\ModifyButtonBarEvent

  Priebera\A11yQualityGate\Ai\Task\AiStructuredTaskRunner:
    arguments:
      $executors: !tagged_iterator a11y_quality_gate.ai_task_executor

  Priebera\A11yQualityGate\Controller\AiSettingsAjaxController:
