<html
        xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
        data-namespace-typo3-fluid="true"
>
<div
        class="aqg-progress-block {f:if(condition: activeRemoteScan.job_id, then: '', else: 'd-none')}"
        data-a11y-remote-scan-progress="true"
        data-a11y-remote-job-id="{activeRemoteScan.job_id}"
        data-a11y-remote-site-identifier="{activeRemoteScan.site_identifier}"
        data-a11y-remote-scope="{activeRemoteScan.scan_scope}"
        data-a11y-remote-page-uid="{activeRemoteScan.page_uid}"
        data-a11y-remote-status="{activeRemoteScan.status}"
        data-a11y-remote-pages-scanned="{activeRemoteScan.pages_scanned}"
        data-a11y-remote-pages-total="{activeRemoteScan.pages_total}"
        data-a11y-remote-language-uid="{activeRemoteScan.language_uid}"
>
    <div class="aqg-progress-block__head">
        <div class="aqg-progress-block__title">
            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
            <f:translate
                    key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:module.remotePageDetail.scan"
                    default="Frontend scan"
            />
        </div>

        <div class="aqg-progress-block__head-actions">
            <span class="aqg-status-badge aqg-status-badge--running" data-a11y-remote-scan-status="true"></span>
            <button
                    type="button"
                    class="btn btn-sm aqg-btn-danger-outline aqg-progress-block__cancel"
                    data-action="a11y-pro-cancel-scan"
                    data-job-id="{activeRemoteScan.job_id}"
                    data-site-identifier="{activeRemoteScan.site_identifier}"
                    data-loading-text="Cancelling..."
            >
                Cancel
            </button>
        </div>
    </div>

    <div class="aqg-progress-block__bar" role="progressbar" aria-valuemin="0" aria-valuemax="100">
        <div class="aqg-progress-block__fill"></div>
    </div>

    <div class="aqg-progress-block__foot">
        <span data-a11y-remote-scan-message="true"></span>
        <span class="aqg-meta" data-a11y-remote-scan-background-hint="true">
            <f:translate
                    key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.progress.backgroundHint"
                    default="You can leave this page; the scan keeps running."
            />
        </span>
    </div>
</div>
</html>
