<html
        xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
        data-namespace-typo3-fluid="true"
>
<span class="aqg-pill aqg-pill--severity tone-{tone}">
    <span class="aqg-pill__icon" aria-hidden="true">
        <f:switch expression="{tone}">
            <f:case value="critical">
                <svg width="12" height="12" viewBox="0 0 16 16" focusable="false">
                    <path d="M8 2.2 14 13.4H2L8 2.2Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
                    <path d="M8 5.7v3.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                    <circle cx="8" cy="11.2" r=".75" fill="currentColor" />
                </svg>
            </f:case>
            <f:case value="warning">
                <svg width="12" height="12" viewBox="0 0 16 16" focusable="false">
                    <path d="M8 2.2 14 13.4H2L8 2.2Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
                    <path d="M8 5.7v3.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                    <circle cx="8" cy="11.2" r=".75" fill="currentColor" />
                </svg>
            </f:case>
            <f:case value="info">
                <svg width="12" height="12" viewBox="0 0 16 16" focusable="false">
                    <circle cx="8" cy="8" r="5.8" fill="none" stroke="currentColor" stroke-width="1.5" />
                    <path d="M8 7.2v3.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                    <circle cx="8" cy="5" r=".75" fill="currentColor" />
                </svg>
            </f:case>
            <f:case value="ok">
                <svg width="12" height="12" viewBox="0 0 16 16" focusable="false">
                    <circle cx="8" cy="8" r="5.8" fill="none" stroke="currentColor" stroke-width="1.5" />
                    <path d="M5 8.2 7.1 10.2 11.2 5.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </f:case>
            <f:defaultCase>
                <svg width="12" height="12" viewBox="0 0 16 16" focusable="false">
                    <circle cx="8" cy="8" r="5.8" fill="none" stroke="currentColor" stroke-width="1.5" />
                </svg>
            </f:defaultCase>
        </f:switch>
    </span>
    <span>
        <f:switch expression="{name}">
            <f:case value="critical">
                <f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:severity.critical" default="Critical" />
            </f:case>
            <f:case value="warning">
                <f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:severity.warning" default="Warning" />
            </f:case>
            <f:case value="info">
                <f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:severity.info" default="Info" />
            </f:case>
            <f:case value="ok">
                <f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:module.pageDetail.status.noIssues" default="No issues" />
            </f:case>
            <f:case value="serious">
                <f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:module.remotePageDetail.impact.serious" default="Serious" />
            </f:case>
            <f:case value="moderate">
                <f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:module.remotePageDetail.impact.moderate" default="Moderate" />
            </f:case>
            <f:case value="minor">
                <f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:module.remotePageDetail.impact.minor" default="Minor" />
            </f:case>
            <f:defaultCase>{name}</f:defaultCase>
        </f:switch>
    </span>
</span>
</html>
