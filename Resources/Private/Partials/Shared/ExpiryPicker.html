<html
        xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
        data-namespace-typo3-fluid="true"
>
<div class="aqg-expiry" data-a11y-expiry-picker="true">
    <div class="aqg-expiry__label"><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:ignore.expiry.label" default="Reopen automatically" /> <span class="aqg-expiry__sub"><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:ignore.expiry.optional" default="optional" /></span></div>
    <div class="aqg-expiry__row" role="radiogroup" aria-label="{f:translate(key: 'LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:ignore.expiry.ariaLabel', default: 'Ignore duration')}">
        <label class="aqg-expiry__chip is-active">
            <input type="radio" name="ignoreExpiry" value="never" checked="checked" />
            <span class="aqg-expiry__chip-dot" aria-hidden="true"></span>
            <f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:ignore.expiry.never" default="Ignore permanently" />
        </label>
        <label class="aqg-expiry__chip">
            <input type="radio" name="ignoreExpiry" value="7d" />
            <span class="aqg-expiry__chip-dot" aria-hidden="true"></span>
            <f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:ignore.expiry.days7" default="Ignore for 7 days" />
        </label>
        <label class="aqg-expiry__chip">
            <input type="radio" name="ignoreExpiry" value="30d" />
            <span class="aqg-expiry__chip-dot" aria-hidden="true"></span>
            <f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:ignore.expiry.days30" default="Ignore for 30 days" />
        </label>
        <label class="aqg-expiry__chip">
            <input type="radio" name="ignoreExpiry" value="90d" />
            <span class="aqg-expiry__chip-dot" aria-hidden="true"></span>
            <f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:ignore.expiry.days90" default="Ignore for 90 days" />
        </label>
        <label class="aqg-expiry__chip">
            <input type="radio" name="ignoreExpiry" value="custom" />
            <span class="aqg-expiry__chip-dot" aria-hidden="true"></span>
            <f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:ignore.expiry.custom" default="Ignore until date…" />
        </label>
    </div>
    <div class="aqg-expiry__custom" data-a11y-expiry-custom="true" hidden="hidden">
        <label class="aqg-expiry__custom-label" for="{inputId}{issueUid}"><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:ignore.expiry.reopenOn" default="Reopen on" /></label>
        <input id="{inputId}{issueUid}" type="date" name="ignoreUntilDate" class="aqg-expiry__custom-date" />
        <div class="aqg-expiry__custom-helper"><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:ignore.expiry.customHelp" default="The issue will reopen at the start of this day in your TYPO3 timezone." /></div>
    </div>
    <div class="aqg-expiry__preview" data-a11y-expiry-preview="true"><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:ignore.expiry.permanentPreview" default="The issue stays ignored until someone unignores it manually." /></div>
    <div class="aqg-expiry__error" data-a11y-expiry-error="true" hidden="hidden"><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:ignore.expiry.pastDateError" default="The reopen date must be at least one day in the future." /></div>
</div>
</html>
