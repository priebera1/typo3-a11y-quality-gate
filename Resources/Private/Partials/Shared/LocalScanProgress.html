<html
        xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
        data-namespace-typo3-fluid="true"
>
<div
        class="aqg-progress-block aqg-progress-block--local aqg-progress-block--indeterminate {f:if(condition: isRunning, then: '', else: 'd-none')}"
        data-a11y-local-scan-progress="true"
>
    <span class="aqg-progress-block__glyph" aria-hidden="true">
        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
        <span class="aqg-progress-block__icon aqg-progress-block__icon--failed"><f:render partial="Shared/AqgIcon" arguments="{name: 'x'}" /></span>
        <span class="aqg-progress-block__icon aqg-progress-block__icon--completed"><f:render partial="Shared/AqgIcon" arguments="{name: 'ok'}" /></span>
    </span>

    <div class="aqg-progress-block__main">
        <span class="aqg-progress-block__state" data-a11y-local-scan-state="true">
            <f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.scan.stateRunning" default="Running" />
        </span>
        <div class="aqg-progress-block__title">
            <span data-a11y-local-scan-title="true">
                <f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.localScan.runningTitle" default="Content scan is running" />
            </span>
        </div>
        <p class="aqg-progress-block__foot">
            <f:if condition="{isRunning} && {scanStatus.startedAt}">
                <f:then>
                    <span data-a11y-local-scan-started="true"><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.progress.started" default="Started" /> <f:format.date date="{scanStatus.startedAt}" format="H:i" /> · </span>
                </f:then>
                <f:else>
                    <span data-a11y-local-scan-started="true"></span>
                </f:else>
            </f:if>
            <span data-a11y-local-scan-message="true">
                <f:if condition="{hasPreviousResult}">
                    <f:then><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.scan.previousStaysVisible" default="Previous result stays visible until it finishes." /></f:then>
                    <f:else><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.localScan.runningShort" default="This usually takes a moment." /></f:else>
                </f:if>
            </span>
        </p>
        <f:if condition="{canCancel}">
            <div class="aqg-progress-block__actions">
                <button
                        type="button"
                        class="aqg-progress-block__cancel"
                        data-action="a11y-local-cancel-scan"
                        data-loading-text="{f:translate(key: 'LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:action.cancelling', default: 'Cancelling…')}"
                >
                    <f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:action.cancelScan" default="Cancel scan" />
                </button>
            </div>
        </f:if>
    </div>

    <span class="aqg-status-badge aqg-status-badge--running aqg-progress-block__badge" data-a11y-local-scan-status="true">
        <f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.localScan.activeShort" default="active" />
    </span>
    <div class="aqg-progress-block__bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-hidden="true">
        <div class="aqg-progress-block__fill"></div>
    </div>
</div>
</html>
