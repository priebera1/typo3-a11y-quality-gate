<f:if condition="{guidance.hasAny}">
    <div class="aqg-local-guidance" role="group" aria-label="{f:translate(key: 'LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:module.localGuidance.ariaLabel', default: 'Local issue guidance')}" data-aqg-local-guidance="true">
        <f:if condition="{guidance.whyItMatters} && {section} != 'reference'">
            <f:if condition="{section} != 'why'">
                <h4><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:module.remotePageDetail.guidance.whyItMatters" default="Why it matters" /></h4>
            </f:if>
            <p>{guidance.whyItMatters}</p>
        </f:if>

        <f:if condition="{showHowToFix} && {guidance.howToFix}">
            <h4><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:module.remotePageDetail.guidance.howToFix" default="How to fix" /></h4>
            <p>{guidance.howToFix}</p>
        </f:if>

        <f:if condition="{guidance.hasAffectedUsers} && {section} != 'reference'">
            <h4><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:module.localGuidance.affectedUsers" default="Affected users" /></h4>
            <div class="aqg-affected-user-badges aqg-affected-user-badges--metadata">
                <f:for each="{guidance.affectedUserItems}" as="affectedUser">
                    <f:render partial="RuleMetadata/AffectedUserBadge" arguments="{item: affectedUser}" />
                </f:for>
            </div>
        </f:if>

        <f:if condition="({guidance.hasBadges} || {guidance.hasStandardsAndImpact}) && {section} != 'why'">
            <f:if condition="{section} != 'reference'">
                <h4><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:module.localGuidance.standardsAndImpact" default="Standards and impact" /></h4>
            </f:if>
            <dl class="aqg-kvlist">
                <f:if condition="{guidance.hasBadges}">
                    <f:if condition="{guidance.owner}">
                        <dt><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:module.localGuidance.owner" default="Owner" /></dt>
                        <dd>{guidance.ownerLabel}</dd>
                    </f:if>
                    <f:if condition="{guidance.fixType}">
                        <dt><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:module.localGuidance.fixType" default="Fix type" /></dt>
                        <dd>{guidance.fixTypeLabel}</dd>
                    </f:if>
                    <f:if condition="{guidance.wcagPrimaryLabel} && !{guidance.wcagReferences}">
                        <dt>WCAG</dt>
                        <dd>{guidance.wcagPrimaryLabel}</dd>
                    </f:if>
                </f:if>
                <f:if condition="{guidance.hasStandardsAndImpact}">
                    <f:if condition="{guidance.wcagReferences}">
                        <dt><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:module.localGuidance.wcagReference" default="WCAG reference" /></dt>
                        <dd>
                            <f:for each="{guidance.wcagReferences}" as="wcag" iteration="wcagIterator">
                                <f:if condition="{wcag.url}">
                                    <f:then><a href="{wcag.url}" target="_blank" rel="noopener noreferrer">{wcag.label}</a></f:then>
                                    <f:else>{wcag.label}</f:else>
                                </f:if><f:if condition="!{wcagIterator.isLast}">; </f:if>
                            </f:for>
                        </dd>
                    </f:if>
                    <f:if condition="{guidance.techniques}">
                        <dt><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:module.localGuidance.technique" default="Technique" /></dt>
                        <dd>
                            <f:for each="{guidance.techniques}" as="technique" iteration="techniqueIterator">
                                <f:if condition="{technique.url}">
                                    <f:then><a href="{technique.url}" target="_blank" rel="noopener noreferrer">{technique.label}</a></f:then>
                                    <f:else>{technique.label}</f:else>
                                </f:if><f:if condition="!{techniqueIterator.isLast}">; </f:if>
                            </f:for>
                        </dd>
                    </f:if>
                    <f:if condition="{guidance.standards}">
                        <dt><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:module.localGuidance.standards" default="Standards" /></dt>
                        <dd><f:for each="{guidance.standards}" as="standard" iteration="standardIterator">{standard}<f:if condition="!{standardIterator.isLast}">, </f:if></f:for></dd>
                    </f:if>
                    <f:if condition="{guidance.documentationLinks}">
                        <dt><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:module.localGuidance.documentation" default="Documentation" /></dt>
                        <dd><f:for each="{guidance.documentationLinks}" as="doc" iteration="docIterator"><a href="{doc.url}" target="_blank" rel="noopener noreferrer">{doc.label}</a><f:if condition="!{docIterator.isLast}">, </f:if></f:for></dd>
                    </f:if>
                    <f:if condition="{guidance.technicalTags}">
                        <dt><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:module.localGuidance.technicalTags" default="Technical tags" /></dt>
                        <dd><f:for each="{guidance.technicalTags}" as="tag" iteration="tagIterator"><code>{tag}</code><f:if condition="!{tagIterator.isLast}"> </f:if></f:for></dd>
                    </f:if>
                </f:if>
            </dl>
        </f:if>
    </div>
</f:if>
