<f:if condition="{plan.hasTasks}">
    <section class="aqg-remediation-plan aqg-remediation-plan--{variant}" aria-label="{f:translate(key: 'LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:remote.plan.kicker', default: 'Recommended remediation plan')}">
        <div class="aqg-remediation-plan__head">
            <div>
                <div class="aqg-remediation-plan__kicker"><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:remote.plan.kicker" default="Recommended remediation plan" /></div>
                <h2 class="aqg-remediation-plan__title"><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:remote.plan.title" default="What to fix first" /></h2>
                <p class="aqg-remediation-plan__subtitle"><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:remote.plan.subtitle" default="Automated remediation plan. Manual review may still be required." /></p>
            </div>
        </div>

        <f:if condition="{plan.hasTasks}">
            <f:then>
                <ol class="aqg-remediation-plan__tasks">
                    <f:for each="{plan.tasks}" as="task" iteration="taskIterator">
                        <li class="aqg-remediation-plan__task">
                            <div class="aqg-remediation-plan__task-head">
                                <span class="aqg-remediation-plan__priority">{taskIterator.cycle}</span>
                                <div>
                                    <h3>{task.title}</h3>
                                    <f:if condition="{task.summary}">
                                        <p>{task.summary}</p>
                                    </f:if>
                                </div>
                            </div>
                            <dl class="aqg-remediation-plan__meta">
                                <div><dt><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:remote.plan.owner" default="Suggested owner" /></dt><dd>{task.ownerLabel}</dd></div>
                                <div><dt><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:remote.plan.fixType" default="Fix type" /></dt><dd>{task.fixTypeLabel}</dd></div>
                                <div><dt><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:remote.history.impact" default="Impact" /></dt><dd>{task.impactLabel}</dd></div>
                                <div><dt><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:remote.history.occurrences" default="Occurrences" /></dt><dd>{task.findingsTotalLabel}</dd></div>
                                <div><dt><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:remote.plan.affectedPages" default="Affected pages" /></dt><dd>{task.affectedPagesTotalLabel}</dd></div>
                                <div><dt><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:remote.plan.effort" default="Estimated effort" /></dt><dd>{task.estimatedEffortLabel}</dd></div>
                            </dl>
                            <f:if condition="{task.quickWinLabel}">
                                <span class="aqg-remediation-plan__badge">{task.quickWinLabel}</span>
                            </f:if>
                            <f:if condition="{task.hasSteps}">
                                <div class="aqg-remediation-plan__steps">
                                    <strong><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:remote.plan.steps" default="Recommended steps" /></strong>
                                    <ol>
                                        <f:for each="{task.steps}" as="step">
                                            <li>{step}</li>
                                        </f:for>
                                    </ol>
                                </div>
                            </f:if>
                            <f:if condition="{task.hasExamples}">
                                <div class="aqg-remediation-plan__examples">
                                    <strong><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:remote.plan.examples" default="Examples" /></strong>
                                    <ul>
                                        <f:for each="{task.examples}" as="example">
                                            <li>{example}</li>
                                        </f:for>
                                    </ul>
                                </div>
                            </f:if>
                        </li>
                    </f:for>
                </ol>
            </f:then>
        </f:if>
    </section>
</f:if>
