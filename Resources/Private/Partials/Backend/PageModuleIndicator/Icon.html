<f:switch expression="{state}">
    <f:case value="ok">
        <svg class="aqg-page-module-indicator__icon" aria-hidden="true" viewBox="0 0 14 14" focusable="false">
            <path d="M3 7.2 L6 10 L11 4.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
    </f:case>
    <f:case value="warning">
        <svg class="aqg-page-module-indicator__icon" aria-hidden="true" viewBox="0 0 14 14" focusable="false">
            <path d="M7 1.6 L13 12.4 L1 12.4 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
            <path d="M7 5.6 L7 8.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            <circle cx="7" cy="10.6" r="0.9" fill="currentColor" />
        </svg>
    </f:case>
    <f:case value="error">
        <svg class="aqg-page-module-indicator__icon" aria-hidden="true" viewBox="0 0 14 14" focusable="false">
            <circle cx="7" cy="7" r="5.6" fill="none" stroke="currentColor" stroke-width="1.6" />
            <path d="M4.6 4.6 L9.4 9.4 M9.4 4.6 L4.6 9.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
    </f:case>
    <f:case value="running">
        <svg class="aqg-page-module-indicator__icon aqg-page-module-indicator__icon--spin" aria-hidden="true" viewBox="0 0 14 14" focusable="false">
            <circle cx="7" cy="7" r="5.4" fill="none" stroke="currentColor" stroke-opacity="0.25" stroke-width="1.6" />
            <path d="M12.4 7 A5.4 5.4 0 0 0 7 1.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
    </f:case>
    <f:defaultCase>
        <svg class="aqg-page-module-indicator__icon" aria-hidden="true" viewBox="0 0 14 14" focusable="false">
            <circle cx="7" cy="7" r="5.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2 2" />
        </svg>
    </f:defaultCase>
</f:switch>
