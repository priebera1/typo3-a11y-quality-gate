<html
        xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
        data-namespace-typo3-fluid="true"
>
<div class="aqt-section" data-aqt-source="{card.key}" data-aqt-state="{card.state}">
    <div class="aqt-section__head">
        <p class="aqt-section__title">{card.title}</p>
        <span class="aqt-tag aqt-tag--{card.tagTone}">
            <f:if condition="{card.tagIcon} == 'spin'">
                <f:then><span class="aqt-spinner" aria-hidden="true"></span></f:then>
                <f:else><f:render partial="Shared/AqgIcon" arguments="{name: card.tagIcon, size: 'sm'}" /></f:else>
            </f:if>
            <span>{card.tagLabel}</span>
        </span>
    </div>
    <f:if condition="{card.delta}">
        <p class="aqt-section__delta">{card.delta}</p>
    </f:if>
    <f:if condition="{card.meta}">
        <p class="aqt-section__meta">{card.meta}</p>
    </f:if>
    <f:if condition="{card.progress}">
        <div class="aqt-progress" aria-hidden="true"><span class="aqt-progress__bar" style="width: {card.progress}%"></span></div>
    </f:if>
</div>
</html>
