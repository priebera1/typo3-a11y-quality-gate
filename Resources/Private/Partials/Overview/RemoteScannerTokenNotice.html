<html
        xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
        data-namespace-typo3-fluid="true"
>
<div class="aqg-notice aqg-tone-warning aqg-remote-token-notice" role="note">
    <span class="aqg-notice__icon" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 16 16" focusable="false">
            <path d="M8 2.2 14 13H2L8 2.2Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" />
            <path d="M8 6.1v3.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
            <path d="M8 11.7h.01" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
    </span>
    <span class="aqg-notice__body">
        <span class="aqg-notice__title">
            <f:translate
                    key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.remoteScannerTokenNotice.title"
                    default="No Scanner Token for this site"
            />
        </span>
        <span class="aqg-notice__text">
            <f:translate
                    key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.remoteScannerTokenNotice.text"
                    default="No Scanner Token is configured for this site. Remote scans can only access publicly visible pages, and TYPO3 does not mark content records for them, so findings outside standard content frames are not linked to their record."
            />
        </span>
    </span>
    <span class="aqg-notice__actions">
        <a href="{settingsUrl}" class="btn btn-default btn-sm aqg-notice__link">
            <f:translate
                    key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.remoteScannerTokenNotice.cta"
                    default="Open Remote Scan Access settings"
            />
        </a>
    </span>
</div>
</html>
