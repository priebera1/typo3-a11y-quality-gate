<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<section class="aqg-section aqg-section--scan">
    <div class="aqg-section__head">
        <div>
            <h2 class="aqg-section__title">
                <f:translate
                        key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.source.remote"
                        default="Frontend scan"
                />
            </h2>
            <p class="aqg-section__sub">
                <f:translate
                        key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.remoteActions.description"
                        default="Scan published frontend pages."
                />
            </p>
        </div>

        <div class="aqg-section__actions">
            <f:if condition="{currentPageUid}">
                <f:if condition="{currentPageUrl}">
                    <f:then>
                        <button
                                type="button"
                                class="btn btn-default btn-sm"
                                data-action="a11y-pro-scan-page"
                                data-page-uid="{currentPageUid}"
                                data-page-url="{currentPageUrl}"
                                data-site-identifier="{siteIdentifier}"
                                data-language-uid="{currentLanguageUid}"
                                data-loading-text="{f:translate(key: 'LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:action.scanning', default: 'Scanning...')}"
                        >
                            <f:translate
                                    key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:action.remoteScanPage"
                                    default="Scan this page"
                            />
                        </button>
                    </f:then>
                    <f:else>
                        <button
                                type="button"
                                class="btn btn-default btn-sm"
                                disabled="disabled"
                                title="This page is not translated in the selected site language."
                        >
                            <f:translate
                                    key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:action.remoteScanPage"
                                    default="Scan this page"
                            />
                        </button>
                    </f:else>
                </f:if>
            </f:if>

            <f:if condition="{canScanAll}">
                <button
                        type="button"
                        class="btn btn-primary btn-sm"
                        data-action="a11y-pro-scan-site"
                        data-root-pid="{siteRootPid}"
                        data-max-pages="{f:if(condition: proStatus.isTrial, then: '10', else: '500')}"
                        data-language-uid="{currentLanguageUid}"
                        data-loading-text="{f:translate(key: 'LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:action.scanning', default: 'Scanning...')}"
                >
                    <f:translate
                            key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:action.remoteScanSite"
                            default="Scan site"
                    />
                </button>
            </f:if>

            <f:render
                    partial="Shared/ExportButtons"
                    arguments="{
                        show: exportRemoteCsvUrl,
                        csvUrl: exportRemoteCsvUrl,
                        pdfUrl: exportRemotePdfUrl,
                        showPdf: proStatus.hasExportPdf
                    }"
            />
        </div>
    </div>

    <div class="aqg-section__body">
        <div class="aqg-section__meta-row">
            <div class="aqg-meta-item">
                <span class="aqg-meta-item__label">
                    <f:translate
                            key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.lastScan.label"
                            default="Last scan"
                    />
                </span>
                <span class="aqg-meta-item__value">
                    <f:if condition="{remoteScan.finished_at}">
                        <f:then><f:if condition="{remoteScan.finished_at_formatted}"><f:then>{remoteScan.finished_at_formatted}</f:then><f:else>{remoteScan.finished_at -> f:format.date(format: 'd.m.Y H:i')}</f:else></f:if></f:then>
                        <f:else>—</f:else>
                    </f:if>
                </span>
            </div>
            <div class="aqg-meta-item">
                <span class="aqg-meta-item__label">
                    <f:translate
                            key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.proSummary.pagesScanned"
                            default="Pages scanned"
                    />
                </span>
                <span class="aqg-meta-item__value">
                    <f:if condition="{remoteScan}">
                        <f:then>
                            <f:if condition="{remoteScan.pages_total}">
                                <f:then>{remoteScan.pages_scanned} / {remoteScan.pages_total}</f:then>
                                <f:else>{remoteScan.pages_scanned}</f:else>
                            </f:if>
                        </f:then>
                        <f:else>— / —</f:else>
                    </f:if>
                </span>
            </div>
            <div class="aqg-meta-item">
                <span class="aqg-meta-item__label">
                    <f:translate
                            key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.proSummary.issuesTotal"
                            default="Total issues"
                    />
                </span>
                <span class="aqg-meta-item__value"><f:if condition="{remoteScan}"><f:then>{remoteScan.issues_total}</f:then><f:else>—</f:else></f:if></span>
            </div>
            <div class="aqg-meta-item">
                <span class="aqg-meta-item__label">
                    <f:translate
                            key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.proSummary.issuesResolved"
                            default="Resolved"
                    />
                </span>
                <span class="aqg-meta-item__value"><f:if condition="{remoteScan}"><f:then>-{remoteScan.issues_resolved}</f:then><f:else>—</f:else></f:if></span>
            </div>
        </div>

        <f:if condition="{remoteScan}">
            <f:else>
                <p class="aqg-section__sub mt-2 mb-0">
                    <f:translate
                            key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.proSummary.runSiteScanHint"
                            default="Run Scan site to create a site-wide frontend audit."
                    />
                </p>
            </f:else>
        </f:if>

        <f:if condition="{proStatus.isTrial}">
            <div class="aqg-limits">
                <span class="aqg-limit-pill aqg-limit-pill--trial">
                    <f:translate
                            key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.proStatus.trial"
                            default="TRIAL"
                    />
                </span>
                <span class="aqg-limit-pill">
                    <i class="aqg-limit-pill__dot" aria-hidden="true"></i>
                    <f:translate
                            key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:settings.licence.limit.maxPages"
                            default="Max 10 pages per frontend scan"
                    />
                </span>
                <span class="aqg-limit-pill">
                    <i class="aqg-limit-pill__dot" aria-hidden="true"></i>
                    <f:translate
                            key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:settings.licence.limit.maxScans"
                            default="Max 5 scans per day"
                    />
                </span>
            </div>
        </f:if>
    </div>
</section>
</html>
