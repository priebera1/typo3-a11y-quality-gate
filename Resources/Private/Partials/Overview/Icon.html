<html
        xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
        data-namespace-typo3-fluid="true"
>
<f:switch expression="{name}">
    <f:case value="ok">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.4" />
            <path d="M5 8.2 L7.1 10.2 L11.2 5.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
    </f:case>
    <f:case value="warning">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M8 2.4 L14 13.2 H2 Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
            <path d="M8 5.7 V9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <circle cx="8" cy="11.4" r=".75" fill="currentColor" />
        </svg>
    </f:case>
    <f:case value="running">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M12.5 5.2 A5 5 0 1 0 13 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <path d="M12.6 2.8 V5.4 H10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
    </f:case>
    <f:defaultCase>
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M2.4 8 L4.5 3 L11.5 3 L13.6 8 L13.6 13 L2.4 13 Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" />
            <path d="M2.4 8 L6 8 L6.6 9.4 L9.4 9.4 L10 8 L13.6 8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" />
        </svg>
    </f:defaultCase>
</f:switch>
</html>
