<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<div class="aqg-sourcetabs" role="tablist" aria-label="{f:translate(key: 'LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.source.tablist', default: 'Scan type')}">
    <button
            type="button"
            role="tab"
            id="aqg-overview-tab-local"
            class="aqg-sourcetab"
            aria-selected="true"
            aria-controls="aqg-overview-panel-local"
            tabindex="0"
            data-a11y-overview-source-trigger="local"
    >
        <f:translate
                key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.source.local"
                default="Content scan"
        />
    </button>

    <button
            type="button"
            role="tab"
            id="aqg-overview-tab-remote"
            class="aqg-sourcetab"
            aria-selected="false"
            aria-controls="aqg-overview-panel-remote"
            tabindex="-1"
            data-a11y-overview-source-trigger="remote"
    >
        <f:translate
                key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.source.remote"
                default="Frontend scan"
        />

        <f:if condition="{remoteScan}">
            <f:if condition="{remoteScan.issues_new} > 0">
                <span class="aqg-sourcetab__badge">
                    {remoteScan.issues_new}
                    <f:translate
                            key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.source.newIssues"
                            default="new"
                    />
                </span>
            </f:if>
        </f:if>
    </button>
</div>
</html>
