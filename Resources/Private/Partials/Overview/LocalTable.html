<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<div>
    <f:if condition="{pageStats}">
        <f:then>
            <div class="aqg-table-wrap">
                <table class="aqg-table">
                    <thead>
                    <tr>
                        <th scope="col">
                            <f:translate
                                    key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.table.page"
                                    default="Page"
                            />
                        </th>
                        <th scope="col" class="num">
                            <f:translate
                                    key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:severity.critical"
                                    default="Critical"
                            />
                        </th>
                        <th scope="col" class="num">
                            <f:translate
                                    key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:severity.warning"
                                    default="Warning"
                            />
                        </th>
                        <th scope="col" class="num">
                            <f:translate
                                    key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:severity.info"
                                    default="Info"
                            />
                        </th>
                        <th scope="col" class="num">
                            <f:translate
                                    key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.table.total"
                                    default="Total"
                            />
                        </th>
                        <th scope="col" class="actions">
                            <f:translate
                                    key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.table.actions"
                                    default="Actions"
                            />
                        </th>
                    </tr>
                    </thead>

                    <tbody>
                    <f:for each="{pageStats}" as="stat">
                        <tr
                                data-a11y-page-row="true"
                                data-a11y-page-title="{stat.pageTitle}"
                                data-a11y-page-uid="{stat.pageUid}"
                        >
                            <td>
                                <div class="aqg-page-cell">
                                    <div class="aqg-page-cell__title">
                                        <a href="{stat.detailUrl}" title="{stat.pageTitle}">
                                            {stat.pageTitle}
                                        </a>

                                        <f:if condition="{stat.isFolder}">
                                           <span class="aqg-mini-tag">
                                                <f:translate
                                                        key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:pageType.folder"
                                                />
                                            </span>
                                        </f:if>
                                    </div>

                                    <span class="aqg-page-cell__meta">UID {stat.pageUid}</span>
                                </div>
                            </td>

                            <td class="num">
                                <f:if condition="{stat.critical} > 0">
                                    <f:then><span class="aqg-count aqg-count--critical">{stat.critical}</span></f:then>
                                    <f:else><span class="aqg-count aqg-count--zero">—</span></f:else>
                                </f:if>
                            </td>

                            <td class="num">
                                <f:if condition="{stat.warning} > 0">
                                    <f:then><span class="aqg-count aqg-count--warning">{stat.warning}</span></f:then>
                                    <f:else><span class="aqg-count aqg-count--zero">—</span></f:else>
                                </f:if>
                            </td>

                            <td class="num">
                                <f:if condition="{stat.info} > 0">
                                    <f:then><span class="aqg-count aqg-count--info">{stat.info}</span></f:then>
                                    <f:else><span class="aqg-count aqg-count--zero">—</span></f:else>
                                </f:if>
                            </td>

                            <td class="num">
                                <span class="aqg-count aqg-count--total">{stat.total}</span>
                            </td>

                            <td class="actions">
                                <div class="aqg-row-actions">
                                    <a href="{stat.detailUrl}" class="aqg-action-link">
                                        <f:translate
                                                key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:action.viewIssues"
                                                default="View issues"
                                        />
                                    </a>

                                    <button
                                            type="button"
                                            class="btn btn-default btn-sm"
                                            data-action="a11y-rescan"
                                            data-page-uid="{stat.pageUid}"
                                            data-loading-text="{f:translate(key: 'LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:action.scanning', default: 'Scanning...')}"
                                    >
                                        <f:translate
                                                key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:action.scanThisPage"
                                                default="Scan this page"
                                        />
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </f:for>
                    </tbody>
                </table>
            </div>

            <f:if condition="{localPagination.totalPages} > 1">
                <div class="aqg-pagination">
                    <div class="aqg-pagination__info">
                        {totalLocalPages}
                        <f:translate
                                key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.localTable.pages"
                                default="pages"
                        />
                    </div>

                    <nav aria-label="Local pages pagination">
                        <ul class="pagination pagination-sm mb-0 aqg-pagination__nav">
                            <li class="page-item {f:if(condition: localPagination.hasPrevious, then: '', else: 'disabled')}">
                                <a class="page-link" href="{f:if(condition: localPagination.hasPrevious, then: localPagination.previousUrl, else: '#')}">‹</a>
                            </li>

                            <f:for each="{localPaginationItems}" as="item">
                                <f:if condition="{item.type} == 'ellipsis'">
                                    <f:then>
                                        <li class="page-item disabled">
                                            <span class="page-link">{item.label}</span>
                                        </li>
                                    </f:then>
                                    <f:else>
                                        <li class="page-item {f:if(condition: item.active, then: 'active', else: '')}">
                                            <a class="page-link" href="{item.url}">{item.label}</a>
                                        </li>
                                    </f:else>
                                </f:if>
                            </f:for>

                            <li class="page-item {f:if(condition: localPagination.hasNext, then: '', else: 'disabled')}">
                                <a class="page-link" href="{f:if(condition: localPagination.hasNext, then: localPagination.nextUrl, else: '#')}">›</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </f:if>
        </f:then>

        <f:else>
            <f:if condition="{localQuery}">
                <div class="aqg-empty">
                    <div class="aqg-empty__icon" aria-hidden="true">
                        <f:render partial="Overview/Icon" arguments="{name: 'empty'}" />
                    </div>
                    <div class="aqg-empty__title">
                        <f:translate
                                key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.search.noResults"
                                default="No matching pages found."
                        />
                    </div>
                    <div class="aqg-empty__body">
                        <f:translate
                                key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.search.noResults.text"
                                default="Try a shorter query, or clear the filter."
                        />
                    </div>
                </div>
            </f:if>
            <f:if condition="!{localQuery}">
                <div class="aqg-empty {f:if(condition: lastScan, then: 'aqg-empty--ok', else: '')}" role="status">
                    <div class="aqg-empty__icon" aria-hidden="true">
                        <f:if condition="{lastScan}">
                            <f:then><f:render partial="Overview/Icon" arguments="{name: 'ok'}" /></f:then>
                            <f:else><f:render partial="Overview/Icon" arguments="{name: 'empty'}" /></f:else>
                        </f:if>
                    </div>
                    <div class="aqg-empty__title">
                        <f:if condition="{lastScan}">
                            <f:then>
                                <f:translate
                                        key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.noOpenIssues"
                                        default="No open accessibility issues found."
                                />
                            </f:then>
                            <f:else>
                                <f:translate
                                        key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.noScanYet.title"
                                        default="No scan on record"
                                />
                            </f:else>
                        </f:if>
                    </div>
                    <div class="aqg-empty__body">
                        <f:if condition="{lastScan}">
                            <f:then>
                                <f:translate
                                        key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.noOpenIssues.text"
                                        default="All scanned pages currently pass the configured accessibility checks."
                                />
                            </f:then>
                            <f:else>
                                <f:translate
                                        key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.noScanYet.text"
                                        default="Run a content scan to check this page tree for accessibility issues."
                                />
                            </f:else>
                        </f:if>
                    </div>
                </div>
            </f:if>
        </f:else>
    </f:if>
</div>
</html>
