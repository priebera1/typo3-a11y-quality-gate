<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:if condition="{pageStats}">
    <f:then>
        <div class="aqg-table-wrap" data-aqg-scroll-labelledby="a11y-overview-local-pages-title">
            <table class="aqg-table aqg-table--pages aqg-table--linkrows">
                <thead>
                <tr>
                    <th scope="col">
                        <f:translate
                                key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.table.page"
                                default="Page"
                        />
                    </th>
                    <th scope="col" class="num aqg-col-wide">
                        <f:translate
                                key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:severity.critical"
                                default="Critical"
                        />
                    </th>
                    <th scope="col" class="num aqg-col-wide">
                        <f:translate
                                key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:severity.warningPlural"
                                default="Warnings"
                        />
                    </th>
                    <th scope="col" class="num aqg-col-wide">
                        <f:translate
                                key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:severity.info"
                                default="Info"
                        />
                    </th>
                    <th scope="col" class="num aqg-col-wide">
                        <f:translate
                                key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:severity.needsReview"
                                default="Needs review"
                        />
                    </th>
                    <th scope="col" class="num aqg-col-wide">
                        <f:translate
                                key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.table.total"
                                default="Total"
                        />
                    </th>
                    <th scope="col" class="aqg-col-narrow">
                        <f:translate
                                key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.table.openIssues"
                                default="Open issues"
                        />
                    </th>
                    <th scope="col" class="actions">
                        <span class="visually-hidden">
                            <f:translate
                                    key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.table.actions"
                                    default="Actions"
                            />
                        </span>
                    </th>
                </tr>
                </thead>

                <tbody>
                <f:for each="{pageStats}" as="stat">
                    <tr
                            data-a11y-page-row="true"
                            data-a11y-page-title="{stat.pageTitle}"
                            data-a11y-page-uid="{stat.pageUid}"
                            class="{f:if(condition: '{stat.pageUid} == {currentPageUid}', then: 'is-selected')}"
                    >
                        <td>
                            <div class="aqg-page-cell">
                                <div class="aqg-page-cell__title">
                                    <a href="{stat.detailUrl}" class="aqg-rowlink" title="{stat.pageTitle}">{stat.pageTitle}<f:render partial="Shared/AqgIcon" arguments="{name: 'chevr', size: 'sm'}" /></a>
                                </div>
                                <span class="aqg-page-cell__meta">
                                    <span class="aqg-page-cell__base">
                                        UID {stat.pageUid}
                                        <f:if condition="{stat.isFolder}">
                                            · <f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:pageType.folder" />
                                        </f:if>
                                        <f:if condition="{stat.pageUid} == {currentPageUid}">
                                            · <f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.table.selectedPage" default="selected in the page tree" />
                                        </f:if>
                                    </span>
                                    <span class="aqg-page-cell__state" data-a11y-row-state="true" hidden="hidden"></span>
                                </span>
                            </div>
                        </td>

                        <td class="num aqg-col-wide"><f:render section="Count" arguments="{count: stat.critical, level: 'critical'}" /></td>
                        <td class="num aqg-col-wide"><f:render section="Count" arguments="{count: stat.warning, level: 'warning'}" /></td>
                        <td class="num aqg-col-wide"><f:render section="Count" arguments="{count: stat.info, level: 'info'}" /></td>
                        <td class="num aqg-col-wide"><f:render section="Count" arguments="{count: stat.needs_review, level: 'needs-review'}" /></td>
                        <td class="num aqg-col-wide"><span class="aqg-count aqg-count--total">{stat.total}</span></td>

                        <td class="aqg-col-narrow">
                            <span class="aqg-sevmini">
                                <f:if condition="{stat.critical} > 0"><span class="aqg-sevmini__item aqg-sevmini__item--critical"><f:render partial="Shared/AqgIcon" arguments="{name: 'crit', size: 'sm'}" />{stat.critical} <span class="visually-hidden"><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:severity.critical" default="Critical" /></span></span></f:if>
                                <f:if condition="{stat.warning} > 0"><span class="aqg-sevmini__item aqg-sevmini__item--warning"><f:render partial="Shared/AqgIcon" arguments="{name: 'warn', size: 'sm'}" />{stat.warning} <span class="visually-hidden"><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:severity.warningPlural" default="Warnings" /></span></span></f:if>
                                <f:if condition="{stat.info} > 0"><span class="aqg-sevmini__item aqg-sevmini__item--info"><f:render partial="Shared/AqgIcon" arguments="{name: 'info', size: 'sm'}" />{stat.info} <span class="visually-hidden"><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:severity.info" default="Info" /></span></span></f:if>
                                <f:if condition="{stat.needs_review} > 0"><span class="aqg-sevmini__item aqg-sevmini__item--review"><f:render partial="Shared/AqgIcon" arguments="{name: 'rev', size: 'sm'}" />{stat.needs_review} <span class="visually-hidden"><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:severity.needsReview" default="Needs review" /></span></span></f:if>
                            </span>
                        </td>

                        <td class="actions">
                            <f:if condition="{stat.canScan}">
                                <button
                                        type="button"
                                        class="btn btn-default btn-sm aqg-iconbtn"
                                        data-action="a11y-rescan"
                                        data-aqg-loading="spinner"
                                        data-page-uid="{stat.pageUid}"
                                        data-page-title="{stat.pageTitle}"
                                        data-language-uid="{currentLanguageUid}"
                                        aria-label="{f:translate(key: 'LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.table.scanPage', default: 'Scan %s', arguments: {0: stat.pageTitle})}"
                                        title="{f:translate(key: 'LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.table.scanPage', default: 'Scan %s', arguments: {0: stat.pageTitle})}"
                                >
                                    <f:render partial="Shared/AqgIcon" arguments="{name: 'scan'}" />
                                    <span class="aqg-iconbtn__spinner spinner-border spinner-border-sm" aria-hidden="true"></span>
                                </button>
                            </f:if>
                        </td>
                    </tr>
                </f:for>
                </tbody>
            </table>
        </div>

        <f:if condition="{localPagination.totalPages} > 1">
            <div class="aqg-pagination">
                <p class="aqg-pagination__info">
                    {totalLocalPages}
                    <f:if condition="{totalLocalPages} == 1">
                        <f:then><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.localTable.page" default="page" /></f:then>
                        <f:else><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.localTable.pages" default="pages" /></f:else>
                    </f:if>
                </p>
                <nav class="aqg-pagination__nav" aria-label="{f:translate(key: 'LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.local.paginationAria', default: 'Content scan pages pagination')}">
                    <ul class="aqg-pagination__list">
                        <li>
                            <f:if condition="{localPagination.hasPrevious}">
                                <f:then><a class="btn btn-default btn-sm aqg-pagination__link aqg-pagination__link--prev" href="{localPagination.previousUrl}" rel="prev"><span class="aqg-pagination__step-label"><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:assignment.pagination.previous" default="Previous" /></span></a></f:then>
                                <f:else><span class="btn btn-default btn-sm aqg-pagination__link aqg-pagination__link--prev" aria-disabled="true"><span class="aqg-pagination__step-label"><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:assignment.pagination.previous" default="Previous" /></span></span></f:else>
                            </f:if>
                        </li>
                        <f:for each="{localPaginationItems}" as="item">
                            <li>
                                <f:if condition="{item.type} == 'ellipsis'">
                                    <f:then><span class="aqg-pagination__gap" aria-hidden="true">…</span></f:then>
                                    <f:else if="{item.active}"><a class="btn btn-default btn-sm aqg-pagination__link" href="{item.url}" aria-current="page"><span class="visually-hidden"><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:assignment.pagination.page" default="Page" /> </span>{item.label}</a></f:else>
                                    <f:else><a class="btn btn-default btn-sm aqg-pagination__link" href="{item.url}"><span class="visually-hidden"><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:assignment.pagination.page" default="Page" /> </span>{item.label}</a></f:else>
                                </f:if>
                            </li>
                        </f:for>
                        <li>
                            <f:if condition="{localPagination.hasNext}">
                                <f:then><a class="btn btn-default btn-sm aqg-pagination__link aqg-pagination__link--next" href="{localPagination.nextUrl}" rel="next"><span class="aqg-pagination__step-label"><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:assignment.pagination.next" default="Next" /></span></a></f:then>
                                <f:else><span class="btn btn-default btn-sm aqg-pagination__link aqg-pagination__link--next" aria-disabled="true"><span class="aqg-pagination__step-label"><f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:assignment.pagination.next" default="Next" /></span></span></f:else>
                            </f:if>
                        </li>
                    </ul>
                </nav>
            </div>
        </f:if>
    </f:then>

    <f:else>
        <div class="aqg-empty aqg-empty--compact" role="status">
            <div class="aqg-empty__icon" aria-hidden="true">
                <f:render partial="Overview/Icon" arguments="{name: 'empty'}" />
            </div>
            <div>
                <div class="aqg-empty__title">
                    <f:translate
                            key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.search.noResults"
                            default="No matching pages found."
                    />
                </div>
                <div class="aqg-empty__body">
                    <f:translate
                            key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.search.noResults.text"
                            default="Try a shorter query, or clear the filter."
                    />
                </div>
            </div>
        </div>
    </f:else>
</f:if>

<f:section name="Count">
    <f:if condition="{count} > 0">
        <f:then><span class="aqg-count aqg-count--{level}">{count}</span></f:then>
        <f:else><span class="aqg-count aqg-count--zero">—</span></f:else>
    </f:if>
</f:section>
</html>
