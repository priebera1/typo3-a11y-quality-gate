<html
        xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
        data-namespace-typo3-fluid="true"
>
<f:switch expression="{name}">
    <f:case value="check">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" focusable="false">
            <path d="M2.5 6.2 L5 8.4 L9.5 3.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
    </f:case>
    <f:case value="minus">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" focusable="false">
            <path d="M2.5 6 L9.5 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
    </f:case>
    <f:case value="running">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" focusable="false">
            <path d="M11.5 7 A4.5 4.5 0 1 1 7 2.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
            <path d="M7.5 .8 V3 H9.7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
    </f:case>

    <f:case value="pause">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" focusable="false">
            <rect x="3.2" y="2.4" width="2.4" height="9.2" rx=".7" fill="currentColor" />
            <rect x="8.4" y="2.4" width="2.4" height="9.2" rx=".7" fill="currentColor" />
        </svg>
    </f:case>
    <f:case value="block">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" focusable="false">
            <circle cx="7" cy="7" r="5.2" fill="none" stroke="currentColor" stroke-width="1.5" />
            <path d="M3.7 10.3 L10.3 3.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
    </f:case>
    <f:case value="warning">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" focusable="false">
            <path d="M7 1.6 L13 12.4 H1 Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
            <path d="M7 5.6 V8.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <circle cx="7" cy="10.4" r=".85" fill="currentColor" />
        </svg>
    </f:case>
    <f:case value="key">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" focusable="false">
            <circle cx="4.4" cy="8.6" r="2.4" fill="none" stroke="currentColor" stroke-width="1.4" />
            <path d="M6.3 7.3 L12 2.4 M9.6 4.6 L11 6 M10.6 3.4 L12 4.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
        </svg>
    </f:case>
    <f:defaultCase>
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" focusable="false">
            <circle cx="7" cy="7" r="5.6" fill="none" stroke="currentColor" stroke-width="1.4" />
            <circle cx="7" cy="4.2" r=".85" fill="currentColor" />
            <path d="M7 6.4 V10.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
        </svg>
    </f:defaultCase>
</f:switch>
</html>
