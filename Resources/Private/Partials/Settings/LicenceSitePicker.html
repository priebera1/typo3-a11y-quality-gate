<html
        xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
        data-namespace-typo3-fluid="true"
>
<f:comment>
    D-01: on an installation with several sites the licence is shown and checked for one site the user chooses. Each
    option is a plain link to the Settings page for that site, so nothing is validated before the user picks one.
</f:comment>
<f:if condition="{licenceSiteOptions}">
    <nav class="aqg-aside__module" aria-labelledby="aqg-licence-site-picker-title" data-aqg-licence-site-picker="true">
        <h4 class="aqg-aside__title" id="aqg-licence-site-picker-title">
            <f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:settings.licence.sitePicker.title" default="Licence status for site" />
        </h4>
        <ul class="list-unstyled d-flex flex-wrap gap-2 mb-0">
            <f:for each="{licenceSiteOptions}" as="option">
                <li>
                    <f:variable name="siteLabel" value="{option.identifier}" />
                    <f:if condition="{option.domain}"><f:variable name="siteLabel" value="{option.domain} ({option.identifier})" /></f:if>
                    <f:if condition="{option.selected}">
                        <f:then>
                            <a href="{option.url}" class="btn btn-sm btn-primary" aria-current="true" data-aqg-licence-site-option="{option.identifier}">{siteLabel}</a>
                        </f:then>
                        <f:else>
                            <a href="{option.url}" class="btn btn-sm btn-default" data-aqg-licence-site-option="{option.identifier}">{siteLabel}</a>
                        </f:else>
                    </f:if>
                </li>
            </f:for>
        </ul>
    </nav>
</f:if>
</html>
