<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<table class="aqr-sevrow"><tr>
    <f:for each="{row}" as="cell" iteration="iterator">
        <td class="{f:if(condition: iterator.isFirst, else: 'aqr-sevrow__next')}">
            <div class="aqr-sevrow__label"><f:render partial="Export/PdfSeverity" arguments="{tone: cell.tone, label: cell.label}" /></div>
            <div class="aqr-sevrow__value">{cell.count}</div>
            <f:if condition="{cell.foot}"><div class="aqr-sevrow__foot">{cell.foot}</div></f:if>
        </td>
    </f:for>
</tr></table>
</html>
