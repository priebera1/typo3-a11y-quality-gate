<span class="aqg-affected-user-badge aqg-affected-user-badge--{item.icon}">
    <span class="aqg-affected-user-badge__icon" aria-hidden="true">
        <f:switch expression="{item.icon}">
            <f:case value="blind">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12s3.2-5.5 9-5.5 9 5.5 9 5.5-3.2 5.5-9 5.5S3 12 3 12Z" />
                    <path d="M4 4l16 16" />
                    <path d="M9.8 9.8a3.2 3.2 0 0 0 4.4 4.4" />
                </svg>
            </f:case>
            <f:case value="sensory">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="5" r="2.2" />
                    <path d="M5 9h14" />
                    <path d="M12 9v11" />
                    <path d="M8 20l4-7 4 7" />
                    <path d="M17.5 5.5l3 3" />
                    <path d="M20.5 5.5l-3 3" />
                </svg>
            </f:case>
            <f:case value="audio">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 9v6h4l5 4V5L8 9H4Z" />
                    <path d="M17 9.5a4 4 0 0 1 0 5" />
                    <path d="M19.8 7a8 8 0 0 1 0 10" />
                </svg>
            </f:case>
            <f:case value="eye">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12s3.2-5.5 9-5.5 9 5.5 9 5.5-3.2 5.5-9 5.5S3 12 3 12Z" />
                    <circle cx="12" cy="12" r="3" />
                </svg>
            </f:case>
            <f:case value="contrast">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="8.5" />
                    <path d="M12 3.5v17" />
                    <path d="M12 6.5a5.5 5.5 0 0 1 0 11" />
                </svg>
            </f:case>
            <f:case value="mobility">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="10" cy="5" r="2" />
                    <path d="M10 8v5h4l2.5 5" />
                    <path d="M8.5 12.5A5 5 0 1 0 15 18" />
                    <path d="M13.5 10H18" />
                </svg>
            </f:case>
            <f:case value="touch">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 3v8" />
                    <path d="M8.5 7.5 12 11l3.5-3.5" />
                    <path d="M9 14.5v-2a3 3 0 0 1 6 0v2" />
                    <path d="M7 15.5h10l-1.5 4h-7L7 15.5Z" />
                    <path d="M5 5.5a7 7 0 0 1 14 0" />
                </svg>
            </f:case>
            <f:case value="keyboard">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="6" width="18" height="12" rx="2" />
                    <path d="M6.5 10h.01M10 10h.01M13.5 10h.01M17 10h.01" />
                    <path d="M7 14h10" />
                </svg>
            </f:case>
            <f:case value="microphone">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="3" width="6" height="10" rx="3" />
                    <path d="M5.5 11a6.5 6.5 0 0 0 13 0" />
                    <path d="M12 17.5V21" />
                    <path d="M9 21h6" />
                </svg>
            </f:case>
            <f:case value="cognitive">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="8" />
                    <path d="M12 17v-5" />
                    <path d="M12 8h.01" />
                </svg>
            </f:case>
            <f:case value="caption">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="5" width="18" height="14" rx="2" />
                    <path d="M9 10.5a2.5 2.5 0 1 0 0 3" />
                    <path d="M16 10.5a2.5 2.5 0 1 0 0 3" />
                </svg>
            </f:case>
            <f:defaultCase>
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="5" r="2.2" />
                    <path d="M5 9h14" />
                    <path d="M12 9v11" />
                    <path d="M8 20l4-7 4 7" />
                </svg>
            </f:defaultCase>
        </f:switch>
    </span>
    <span class="aqg-affected-user-badge__label">{item.label}</span>
</span>
