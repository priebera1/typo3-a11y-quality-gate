<section
    class="aqg-page-module-indicator aqg-page-module-indicator--{overallState}"
    data-aqg-page-module-indicator="true"
    data-page-uid="{pageUid}"
    data-site="{siteIdentifier}"
    data-language-uid="{languageUid}"
    data-aqg-indicator-running="{f:if(condition: isRunning, then: '1', else: '0')}"
    data-remote-scan-enabled="{f:if(condition: remoteScanEnabled, then: '1', else: '0')}"
    data-aqg-report-url="{reportUrl}"
    data-running-headline="{runningHeadline}"
    data-running-body="{runningBody}"
    data-running-meta="{runningMeta}"
    data-running-status="{runningStatus}"
    aria-label="{title}"
    aria-busy="{f:if(condition: isRunning, then: 'true', else: 'false')}"
>
    <header class="aqg-page-module-indicator__header">
        <h2 class="aqg-page-module-indicator__title">{title}</h2>
        <span class="aqg-page-module-indicator__status-pill">
            <f:render partial="Backend/PageModuleIndicator/Icon" arguments="{state: overallState}" />
            <span>{statusLabel}</span>
        </span>
        <f:if condition="{notPublic}">
            <span class="aqg-page-module-indicator__notpublic" data-aqg-indicator-not-public="true">{notPublic.badge}</span>
        </f:if>
    </header>

    <div class="aqg-page-module-indicator__content">
        <p class="aqg-page-module-indicator__headline">{headline}</p>
        <p class="aqg-page-module-indicator__text">{body}</p>

        <f:if condition="{remediation}">
            <div class="aqg-page-module-indicator__remediation" data-aqg-indicator-remediation="true">
                <f:if condition="{remediation.owners}">
                    <p class="aqg-page-module-indicator__remediation-line aqg-page-module-indicator__owners">
                        <span class="aqg-page-module-indicator__owners-label">{remediation.ownerLabel}</span>
                        <f:for each="{remediation.owners}" as="owner">
                            <span class="aqg-page-module-indicator__owner aqg-page-module-indicator__owner--{owner.owner}">{owner.count} {owner.label}</span>
                        </f:for>
                    </p>
                </f:if>
                <f:if condition="{remediation.ai}"><p class="aqg-page-module-indicator__remediation-line">{remediation.ai}</p></f:if>
                <f:if condition="{remediation.pending}">
                    <p class="aqg-page-module-indicator__remediation-line"><a href="{remediation.queueUrl}" data-aqg-indicator-pending="true">{remediation.pending}</a></p>
                </f:if>
                <p class="aqg-page-module-indicator__remediation-source">{remediation.source}</p>
            </div>
        </f:if>

        <div class="aqg-page-module-indicator__status-list">
            <f:for each="{rows}" as="row">
                <div class="aqg-page-module-indicator__status-row aqg-page-module-indicator__status-row--{row.state}" data-aqg-indicator-source="{row.source}">
                    <span class="aqg-page-module-indicator__status-kind">{row.label}</span>
                    <span class="aqg-page-module-indicator__status-value">
                        <f:if condition="{row.counts}">
                            <f:then>
                                <span class="aqg-page-module-indicator__counts">
                                    <f:for each="{row.counts}" as="count">
                                        <span class="aqg-page-module-indicator__count aqg-page-module-indicator__count--{count.tone}">
                                            <f:render partial="Backend/PageModuleIndicator/Icon" arguments="{state: count.icon}" />
                                            <span>{count.label}</span>
                                        </span>
                                    </f:for>
                                </span>
                            </f:then>
                            <f:else>
                                <f:render partial="Backend/PageModuleIndicator/Icon" arguments="{state: row.state}" />
                                <span>{row.headline}</span>
                            </f:else>
                        </f:if>
                    </span>
                    <f:if condition="{row.meta}">
                        <span class="aqg-page-module-indicator__status-meta">{row.meta}</span>
                    </f:if>
                </div>
            </f:for>
        </div>
    </div>

    <f:if condition="{progress}">
        <div class="aqg-page-module-indicator__progress {progress.modeClass}" role="progressbar" aria-valuemin="0" aria-valuemax="100"{f:if(condition: progress.determinate, then: ' aria-valuenow="{progress.percent}"')} aria-valuetext="{progress.valueText}">
            <span class="aqg-page-module-indicator__progress-bar" style="width:{progress.percent}%"></span>
        </div>
    </f:if>

    <footer class="aqg-page-module-indicator__footer">
        <div class="aqg-page-module-indicator__actions">
            <f:for each="{actions}" as="action">
                <f:render
                    partial="Backend/PageModuleIndicator/Button"
                    arguments="{action: action, pageUid: pageUid, currentPageUrl: currentPageUrl, siteIdentifier: siteIdentifier, scanMode: scanMode, remoteScanEnabled: remoteScanEnabled, languageUid: languageUid, loadingText: loadingText}"
                />
            </f:for>
        </div>

        <p class="aqg-page-module-indicator__meta">{meta}</p>

        <f:if condition="{remoteHint}">
            <div class="aqg-page-module-indicator__pro-hint">
                <f:if condition="{remoteHint.tag}"><span class="aqg-page-module-indicator__pro-tag">{remoteHint.tag}</span></f:if>
                <span>{remoteHint.text}</span>
                <f:if condition="{remoteHint.linkUrl}">
                    <a class="aqg-page-module-indicator__hint-link" href="{remoteHint.linkUrl}">{remoteHint.linkLabel}</a>
                </f:if>
            </div>
        </f:if>
    </footer>
</section>
