<html
        xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
        data-namespace-typo3-fluid="true"
>
<span
        data-a11y-toolbar-data="true"
        data-a11y-running="{f:if(condition: toolbarRunning, then: '1', else: '0')}"
        data-a11y-state="{toolbarState.state}"
        data-a11y-tone="{toolbarState.tone}"
        data-a11y-count="{toolbarState.count}"
        data-a11y-label="{toolbarState.ariaLabel}"
></span>

<div class="aqt-pop" role="region" aria-label="{f:translate(key: 'LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:toolbar.ariaLabel', default: 'Accessibility Quality Gate toolbar summary')}">
    <div class="aqt-pop__head">
        <p class="dropdown-headline aqt-pop__title">
            <f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:toolbar.title" default="Accessibility" />
        </p>
        <f:if condition="{siteLabel}">
            <p class="aqt-pop__site">{siteLabel}</p>
        </f:if>
    </div>

    <ul class="aqt-sections">
        <li class="aqt-sections__item">
            <f:render partial="ToolbarItems/ScanCard" arguments="{card: contentCard}" />
        </li>
        <f:if condition="{frontendCard}">
            <li class="aqt-sections__item">
                <f:render partial="ToolbarItems/ScanCard" arguments="{card: frontendCard}" />
            </li>
        </f:if>
    </ul>

    <div class="aqt-pop__foot">
        <a href="{moduleUrl}" class="btn btn-primary btn-sm aqt-pop__button">
            <f:translate key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:toolbar.openModule" default="Open Accessibility module" />
        </a>
    </div>
</div>
</html>
