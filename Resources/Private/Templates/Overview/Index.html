<html
        xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
        data-namespace-typo3-fluid="true"
>
<f:layout name="Module" />

<f:section name="Content">
    <div
            class="a11y-overview aqg-module aqg-stack container-fluid aqg-sv"
            data-a11y-site-identifier="{siteIdentifier}"
            data-a11y-current-page-uid="{currentPageUid}"
        data-a11y-language-uid="{currentLanguageUid}"
    >

        <header class="aqg-viewhead">
            <h1 class="aqg-viewhead__title">
                <f:translate
                        key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:module.overview.title"
                        default="Accessibility overview"
                />
            </h1>

            <f:if condition="{hasLanguageOptions}">
                <div class="aqg-viewhead__language">
                    <f:render partial="Shared/LanguageControl" arguments="{_all}" />
                </div>
            </f:if>
        </header>

        <f:render partial="Shared/UpdateNotice" arguments="{updateNotice: updateNotice}" />

        <f:if condition="!{hasPageContext}">
            <f:then>
                <f:render partial="Shared/ModuleEmptyState" arguments="{emptyState: emptyState}" />
            </f:then>
            <f:else>
        <f:if condition="{licenceNotice}">
            <div class="aqg-note aqg-note--warning" role="status" data-aqg-licence-notice="{licenceNotice.state}">
                <f:render partial="Shared/AqgIcon" arguments="{name: 'warn'}" />
                <div class="aqg-note__text">
                    <strong>{licenceNotice.title}</strong>
                    {licenceNotice.text}
                </div>
                <div class="aqg-note__actions">
                    <f:if condition="{licenceNotice.primaryAction}">
                        <a href="{licenceNotice.primaryAction.url}" class="btn btn-default btn-sm" data-aqg-licence-action="{licenceNotice.primaryAction.action}" {f:if(condition: licenceNotice.primaryAction.external, then: 'target="_blank" rel="noopener noreferrer"')}>{licenceNotice.primaryAction.label}</a>
                    </f:if>
                    <a href="{licenceNotice.settingsUrl}" class="btn btn-default btn-sm">
                        <f:translate
                                key="LLL:EXT:a11y_quality_gate/Resources/Private/Language/locallang.xlf:overview.licenceNotice.settings"
                                default="Licence settings"
                        />
                    </a>
                </div>
            </div>
        </f:if>

        <f:if condition="{remoteUiAvailable}">
            <f:render
                    partial="Overview/SourceTabs"
                    arguments="{
                        remoteScan: remoteScan
                    }"
            />
        </f:if>

        <div
                class="a11y-overview-panel"
                data-a11y-overview-panel="local"
                id="aqg-overview-panel-local"
                {f:if(condition: remoteUiAvailable, then: 'role="tabpanel" aria-labelledby="aqg-overview-tab-local" tabindex="0"')}
        >
            <f:render
                    partial="Overview/LocalPanel"
                    arguments="{
                        lastScan: lastScan,
                        localRenderedCoverage: localRenderedCoverage,
                        lastScanScopeLabel: lastScanScopeLabel,
                        hasLocalResults: hasLocalResults,
                        totalCounts: totalCounts,
                        localNewCounts: localNewCounts,
                        localScanDelta: localScanDelta,
                        pageStats: pageStats,
                        totalLocalPages: totalLocalPages,
                        localPagination: localPagination,
                        localPaginationItems: localPaginationItems,
                        localQuery: localQuery,
                        remoteQuery: remoteQuery,
                        remoteFailedQuery: remoteFailedQuery,
                        remotePagination: remotePagination,
                        remoteFailedPagination: remoteFailedPagination,
                        canScanAll: canScanAll,
                        canScanNow: canScanNow,
                        siteRootPid: siteRootPid,
                        currentPageUid: currentPageUid,
                        isPageContext: isPageContext,
                        currentPageHasIssues: currentPageHasIssues,
                        currentPageDetailUrl: currentPageDetailUrl,
                        scanStatus: scanStatus,
                        isRelevantLocalScanRunning: isRelevantLocalScanRunning,
                        canCancelLocalScan: canCancelLocalScan,
                        exportLocalCsvUrl: exportLocalCsvUrl,
                        exportLocalPdfUrl: exportLocalPdfUrl,
                        proStatus: proStatus,
                        siteIdentifier: siteIdentifier,
                        currentLanguageUid: currentLanguageUid,
                        languageOptions: languageOptions,
                        gettingStarted: gettingStarted,
                        showFreePreviewNextStep: showFreePreviewNextStep,
                        fieldsInitializedCount: fieldsInitializedCount,
                        hasEnabledFields: hasEnabledFields,
                        hasFieldConfiguration: hasFieldConfiguration,
                        canShowSettings: canShowSettings,
                        scanFieldsSettingsUrl: scanFieldsSettingsUrl
                    }"
            />
        </div>

        <f:if condition="{remoteUiAvailable}">
            <div
                    class="a11y-overview-panel"
                    data-a11y-overview-panel="remote"
                    id="aqg-overview-panel-remote"
                    role="tabpanel"
                    aria-labelledby="aqg-overview-tab-remote"
                    tabindex="0"
                    hidden="hidden"
            >
                <f:render
                        partial="Overview/RemotePanel"
                        arguments="{
                            remoteScan: remoteScan,
                            remoteOccurrences: remoteOccurrences,
                            activeRemoteScan: activeRemoteScan,
                            canCancelRemoteScan: canCancelRemoteScan,
                            remotePages: remotePages,
                            remoteFailedPages: remoteFailedPages,
                            remotePriorityFixes: remotePriorityFixes,
                            remotePriorityFixesVisible: remotePriorityFixesVisible,
                            remotePriorityFixesMoreCount: remotePriorityFixesMoreCount,
                            remoteWcagSummary: remoteWcagSummary,
                            remoteReportSummary: remoteReportSummary,
                            remoteScore: remoteScore,
                            remoteSignalTone: remoteSignalTone,
                            trialUsage: trialUsage,
                            remoteSignalLabel: remoteSignalLabel,
                            remoteScoreTone: remoteScoreTone,
                            remoteSignalIcon: remoteSignalIcon,
                            remoteCoverageNote: remoteCoverageNote,
                            remotePriorityEmpty: remotePriorityEmpty,
                            remoteHasPriorityFixes: remoteHasPriorityFixes,
                            remoteHasNoPriorityFixes: remoteHasNoPriorityFixes,
                            remoteManualReviewChecklist: remoteManualReviewChecklist,
                            remoteReportingGroups: remoteReportingGroups,
                            remoteKeyboardSummary: remoteKeyboardSummary,
                            remoteShowKeyboardSummary: remoteShowKeyboardSummary,
                            remoteStructureSummary: remoteStructureSummary,
                            remoteContrastDetails: remoteContrastDetails,
                            remoteRemediationSummary: remoteRemediationSummary,
                            remoteComponentSummary: remoteComponentSummary,
                            remoteHasAdditionalAutomatedSignals: remoteHasAdditionalAutomatedSignals,
                            remoteScanHasIssues: remoteScanHasIssues,
                            remotePagesArePageScanFallback: remotePagesArePageScanFallback,
                            remotePagesTitle: remotePagesTitle,
                            remotePagesSubtitle: remotePagesSubtitle,
                            remotePagesEmptyTitle: remotePagesEmptyTitle,
                            remotePagesEmptyBody: remotePagesEmptyBody,
                            remotePagesCountLabel: remotePagesCountLabel,
                            remoteRule: remoteRule,
                            remoteRuleFilter: remoteRuleFilter,
                            totalRemotePages: totalRemotePages,
                            totalRemotePagesIsSingle: totalRemotePagesIsSingle,
                            totalRemoteFailedPages: totalRemoteFailedPages,
                            remotePagination: remotePagination,
                            remotePaginationItems: remotePaginationItems,
                            remoteFailedPagination: remoteFailedPagination,
                            remoteFailedPaginationItems: remoteFailedPaginationItems,
                            localPagination: localPagination,
                            localQuery: localQuery,
                            remoteQuery: remoteQuery,
                            remoteFailedQuery: remoteFailedQuery,
                            canScanAll: canScanAll,
                            canScanNow: canScanNow,
                            siteRootPid: siteRootPid,
                            currentPageUid: currentPageUid,
                            isPageContext: isPageContext,
                            currentPageUrl: currentPageUrl,
                            siteIdentifier: siteIdentifier,
                            exportRemoteCsvUrl: exportRemoteCsvUrl,
                            exportRemotePdfUrl: exportRemotePdfUrl,
                            proStatus: proStatus,
                            currentLanguageUid: currentLanguageUid,
                            currentLanguageOption: currentLanguageOption,
                            languageOptions: languageOptions,
                            showRemoteScannerTokenNotice: showRemoteScannerTokenNotice,
                            remoteScanAccessSettingsUrl: remoteScanAccessSettingsUrl,
                            remoteScanHistory: remoteScanHistory,
                            remoteScanCompare: remoteScanCompare,
                            regressionAlert: regressionAlert,
                            freePreview: freePreview,
                            freeSubmitIntent: freeSubmitIntent
                        }"
                />
            </div>
        </f:if>
            </f:else>
        </f:if>

    </div>
</f:section>
</html>
